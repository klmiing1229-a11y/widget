<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}

.sub{font-size:34px;color:#c9c9d6;margin-top:14px;font-weight:500;letter-spacing:-.01em}
.sub b{color:#fff;font-weight:600}
.pill{position:absolute;left:84px;bottom:64px;font-family:"SF Mono",Menlo,monospace;font-size:20px;color:#9ca3af;padding:12px 20px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(255,255,255,.04)}
.pill span{color:#67e8f9}
